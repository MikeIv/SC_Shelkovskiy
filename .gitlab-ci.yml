include:
  - project: marlenuscom/devdeployer
    file: 'template.gitlab-ci.yml'

stages:
  - verify
  - test
  - build
  - deploy

.nodejs:
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

verify:
  extends: .nodejs
  stage: verify
  script:
    - pnpm verify

test:
  extends: .nodejs
  stage: test
  script:
    - pnpm exec playwright install --with-deps chromium
    - pnpm test
    - pnpm test:e2e
  needs:
    - verify

.nuxt_api:
  variables:
    NUXT_PUBLIC_API_BASE: https://schelkovsky-backend-main.grandfs-develop.ru/api/v1
    NUXT_REQUIRE_API_SOURCE: '1'

build:
  extends:
    - .nodejs
    - .nuxt_api
  stage: build
  script:
    - pnpm build
  needs:
    - verify
    - test

deploy develop:
  stage: deploy
  extends:
    - .start
    - .nuxt_api
  variables:
    PROJECT_TYPE: nuxt
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"

destroy develop:
  stage: deploy
  extends: .stop
  needs: []
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"

include:
  - project: marlenuscom/devdeployer
    file: 'template.gitlab-ci.yml'

stages:
  - verify
  - test
  - build
  - deploy

variables:
  # Версия образа Playwright обязана совпадать с `@playwright/test` в package.json:
  # в образе лежат браузеры ровно этой ревизии, поэтому скачивать их не нужно.
  PLAYWRIGHT_VERSION: '1.64.0'

.nodejs:
  image: node:22
  # Свой раннер проекта, а не общие раннеры GitLab: у них ограничен запас минут.
  tags:
    - docker
  interruptible: true
  # Стор пишет только `verify`; остальные джобы читают его с `policy: pull`,
  # чтобы не загружать один и тот же кэш из каждой джобы.
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

.playwright:
  extends: .nodejs
  # Браузеры и системные зависимости Chromium уже в образе: `playwright install --with-deps`
  # не нужен, а значит нет и скачивания ~300 МБ с cdn.playwright.dev на каждом прогоне.
  image: mcr.microsoft.com/playwright:v$PLAYWRIGHT_VERSION-noble
  before_script:
    # В образе Playwright corepack может отсутствовать — тогда pnpm ставим через npm,
    # версия берётся из поля `packageManager` в package.json.
    - corepack enable || npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

verify:
  extends: .nodejs
  stage: verify
  script:
    - pnpm verify

test:
  extends: .nodejs
  stage: test
  cache:
    policy: pull
  script:
    - pnpm test
  needs:
    - verify

e2e:
  extends: .playwright
  stage: test
  cache:
    policy: pull
  script:
    - pnpm test:e2e
  needs:
    - verify
  # В e2e два прогона Playwright подряд (прокси-режим и прямой), и каждый компилирует
  # приложение на ходу; отдельный таймаут не даёт джобе тихо съесть общий час пайплайна.
  timeout: 40m

.nuxt_api:
  variables:
    NUXT_PUBLIC_API_BASE: https://schelkovsky-backend-main.grandfs-develop.ru/api/v1
    NUXT_REQUIRE_API_SOURCE: '1'

build:
  extends:
    - .nodejs
    - .nuxt_api
  stage: build
  cache:
    policy: pull
  script:
    - pnpm build
  needs:
    - verify
    - test
    - e2e

deploy develop:
  stage: deploy
  extends:
    - .start
    - .nuxt_api
  variables:
    PROJECT_TYPE: nuxt
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"

destroy develop:
  stage: deploy
  extends: .stop
  needs: []
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"

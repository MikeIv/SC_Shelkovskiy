# Quality gate + DevOps deploy (marlenuscom/devdeployer).
# Dev URL: GitLab → Operate → Environments после успешного deploy develop.

include:
  - project: marlenuscom/devdeployer
    file: 'template.gitlab-ci.yml'

stages:
  - verify
  - build
  - deploy

.nodejs:
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

verify:
  extends: .nodejs
  stage: verify
  script:
    - pnpm verify

build:
  extends: .nodejs
  stage: build
  script:
    - pnpm build
  needs:
    - verify

deploy develop:
  stage: deploy
  variables:
    PROJECT_TYPE: nuxt
  extends: .start
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"

destroy develop:
  stage: deploy
  extends: .stop
  needs: []
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
